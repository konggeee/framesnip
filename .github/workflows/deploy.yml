# 拆帧大师 FrameSnip —— GitHub Pages 自动发布
# 用法：仓库 Settings → Pages → Source 选 "GitHub Actions"，之后每次 push 到 main 自动构建发布
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 避免连续 push 时并行部署互相冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
